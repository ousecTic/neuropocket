name: Release

# Build the web app, Android APK, and Windows Electron installer, then attach
# them to a DRAFT GitHub release. Push a tag like `v1.5.0` to trigger a release;
# use the manual "Run workflow" button to do a build-only test (no release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual test build (e.g. 1.5.0). Not released.'
        required: false

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          [ -z "$V" ] && V="0.0.0-dev"
          BASE="${V%%-*}"
          IFS='.' read -r MA MI PA <<< "$BASE"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((10#${MA:-0} * 10000 + 10#${MI:-0} * 100 + 10#${PA:-0}))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Stamp version into build.gradle
        shell: bash
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "neuropocket.${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: neuropocket.*.apk
          if-no-files-found: error

  electron:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          [ -z "$V" ] && V="0.0.0-dev"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap copy electron

      - name: Stamp Electron version
        shell: bash
        run: npm --prefix electron version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install Electron deps
        working-directory: electron
        run: npm ci

      - name: Compile Electron
        working-directory: electron
        run: npm run build

      - name: Package NSIS installer
        working-directory: electron
        run: npx electron-builder build -c ./electron-builder.config.json --publish never

      - name: Rename EXE
        shell: bash
        run: cp "electron/dist/Neuropocket Setup ${{ steps.ver.outputs.version }}.exe" "neuropocket.${{ steps.ver.outputs.version }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: neuropocket.*.exe
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [android, electron]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create/update draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Neuropocket ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/exe/*.exe
