name: Release (manual)

# Manual / override release path. Pushing a tag like v1.6.0 builds and PUBLISHES
# a release. The "Run workflow" button does a build-only DRAFT for testing.
# Day-to-day releases happen automatically via auto-release.yml (the PR flow).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a draft test build, e.g. 1.6.0'
        required: true

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            V="${{ github.event.inputs.version }}"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: prep
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.prep.outputs.version }}
      tag: ${{ needs.prep.outputs.tag }}
      ref: ${{ needs.prep.outputs.ref }}
      publish: ${{ needs.prep.outputs.publish == 'true' }}
