name: Auto Release (PR)

# Day-to-day flow: open a PR into main. Once the CI gate passes, the PR is
# auto-merged (squash), the patch version is bumped automatically, and a new
# release is built and PUBLISHED with the APK + EXE attached.
#
# - Bump higher by putting [minor] or [major] in the PR title.
# - Skip the app release (merge only) with [skip release] in the PR title.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: CI gate
    # Only for same-repo PRs (forks get a read-only token and can't auto-merge).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Old-browser compatibility check
        run: npm run lint:compat
      - name: Build web
        run: npm run build
      - name: Build offline single-file
        run: npm run build:offline

  android-smoke:
    name: Old-Android smoke test
    # API 27 (Android 8.1, a 2018 OS) with the google_apis image, which ships an
    # era-correct WebView. The bare AOSP "default" image has NO WebView, so the app
    # can't render there. A strong free proxy for a 2018 Android device, not a
    # guarantee for any specific handset.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Smoke test on Android 8 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis
          arch: x86
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-screenshot
          path: smoke.png
          if-no-files-found: warn

  merge:
    name: Auto-merge
    needs: [check, android-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --squash --delete-branch

  version:
    name: Compute version
    needs: merge
    if: ${{ !contains(github.event.pull_request.title, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          [ -z "$LATEST" ] && LATEST="v0.0.0"
          IFS='.' read -r MA MI PA <<< "${LATEST#v}"
          if echo "$PR_TITLE" | grep -qiE '\[major\]'; then
            MA=$((MA + 1)); MI=0; PA=0
          elif echo "$PR_TITLE" | grep -qiE '\[minor\]'; then
            MI=$((MI + 1)); PA=0
          else
            PA=$((PA + 1))
          fi
          echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "tag=v$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "Next release: v$MA.$MI.$PA (from $LATEST)"

  build:
    name: Build & publish
    needs: version
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      ref: main
      publish: true
